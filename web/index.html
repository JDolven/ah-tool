<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AH Tool</title>
  <meta name="color-scheme" content="dark light">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23e8b64c'/%3E%3Ccircle cx='16' cy='16' r='9' fill='none' stroke='%237a5512' stroke-width='2.5'/%3E%3C/svg%3E">
  <script>
    // Apply stored theme before paint to avoid a flash.
    try { if (localStorage.getItem('ahtool-theme') === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="app.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#/">
        <span class="brand-coin" aria-hidden="true"></span>
        <span class="brand-text">
          <span class="brand-name">AH Tool</span>
          <span class="brand-sub">Auction House</span>
        </span>
      </a>
      <nav class="nav" aria-label="Main menu">
        <a href="#/" data-nav="overview"><span class="nav-ico" aria-hidden="true">◎</span>Overview</a>
        <a href="#/deals" data-nav="deals"><span class="nav-ico" aria-hidden="true">◆</span>Deals</a>
        <a href="#/professions" data-nav="professions"><span class="nav-ico" aria-hidden="true">⚒</span>Professions</a>
        <a href="#/my" data-nav="my"><span class="nav-ico" aria-hidden="true">✪</span>My Professions</a>
        <a href="#/leveling" data-nav="leveling"><span class="nav-ico" aria-hidden="true">⇡</span>Leveling Guide</a>
        <a href="#/shopping" data-nav="shopping"><span class="nav-ico" aria-hidden="true">☰</span>Shopping List<span class="nav-count" id="nav-shop" hidden></span></a>
        <a href="#/watchlist" data-nav="watchlist"><span class="nav-ico" aria-hidden="true">★</span>Watchlist<span class="nav-count nav-count-hot" id="nav-alerts" hidden></span></a>
        <a href="#/market" data-nav="market"><span class="nav-ico" aria-hidden="true">⇄</span>Market Activity</a>
        <a href="#/sales" data-nav="sales"><span class="nav-ico" aria-hidden="true">¤</span>My Sales</a>
        <a href="#/stats" data-nav="stats"><span class="nav-ico" aria-hidden="true">▤</span>Statistics</a>
        <a href="#/postings" data-nav="postings"><span class="nav-ico" aria-hidden="true">✉</span>My auctions</a>
      </nav>
      <div class="side-foot">
        <div class="side-status" id="side-status"><span class="skel" style="width:70%"></span></div>
        <span class="mock-flag" id="mock-flag" hidden>Mock data</span>
      </div>
    </aside>
    <div class="scrim" id="scrim"></div>

    <div class="main">
      <header class="topbar">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Menu">☰</button>
        <div class="search" role="combobox" aria-haspopup="listbox">
          <span class="search-ico" aria-hidden="true">⌕</span>
          <input id="search" type="search" placeholder="Search for item or ID…" autocomplete="off" spellcheck="false"
                 aria-label="Search items" aria-controls="search-results" aria-expanded="false" aria-autocomplete="list">
          <kbd class="search-kbd" aria-hidden="true">/</kbd>
          <div class="search-results" id="search-results" role="listbox" hidden></div>
        </div>
        <div class="top-actions">
          <button class="btn btn-gold" id="refresh-btn" title="Re-read the Auctionator file">
            <span class="refresh-ico" aria-hidden="true">↻</span><span class="btn-label">Refresh</span>
          </button>
          <div class="bell-wrap">
            <button class="icon-btn bell-btn" id="bell-btn" aria-label="Alerts" aria-haspopup="true" aria-expanded="false" title="Alerts">
              <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
              <span class="bell-count" id="bell-count" hidden></span>
            </button>
            <div class="bell-panel" id="bell-panel" hidden></div>
          </div>
          <button class="icon-btn" id="theme-btn" aria-label="Toggle theme"><span class="theme-icon">☀</span></button>
        </div>
      </header>

      <main id="view" class="view" tabindex="-1"></main>

      <footer class="foot">
        Data from Auctionator and AH Tool Logger · Prices in gold/silver/copper · Market price = median of last 14 days
      </footer>
    </div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <script type="module" src="app.js"></script>
</body>
</html>
